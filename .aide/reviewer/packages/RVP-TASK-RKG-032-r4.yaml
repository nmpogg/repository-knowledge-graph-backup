        "API-RKG-CORE-v1@16: Backend deterministic renderer",
        "CON-RKG-CONVERSATION-v1@1: Rendering, persistence and failures"
      ],
      "rule": "natural primary answer must explain the validated requested relation",
      "description": "Indirect paths render only identities joined by an unlabeled arrow, regardless of whether the final or first edge is reads, writes, publishes or consumes. For a calls-prefix path ending in writes, the primary answer never says writes and is indistinguishable from an all-calls/read/event path. The relation survives only in the separate claim details. This fails to explain the requested relation in the natural primary answer and can suggest that a table or event is a called function.",
