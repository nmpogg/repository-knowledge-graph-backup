      "id": "FND-TASK-RKG-032-001",
      "severity": "high",
      "status": "resolved",
      "title": "Explicit inheritance intent accepts a different model relation",
      "location": {
        "path": "src/rkg/conversations/grounded.py",
        "line": 77,
        "symbol": "_relation_types"
      },
      "normative_references": [
        "API-RKG-CORE-v1@16: Structured lookup and narrative validation",
        "CON-RKG-CONVERSATION-v1@1: Model boundary"
      ],
      "rule": "resolved relation types must match explicit caller intent",
      "description": "The explicit relation detector omits inherits_from, contains, exposes and handled_by. With an explicit Type root and a clearly stated inherit-from question, the resolved relation allowlist remains empty, so validate_narrative accepts an implements-only section. The result is persisted as answered even when the requested inheritance has supported evidence.",
      "reproduction": {
        "case": "explicit_inheritance_intent_overridden_by_model_relation",
        "environment": "Temporary Kuzu; valid Type Child inherits_from Base and implements Interface graph; direct runtime MockProvider",
        "expected": "Preserve inherits_from intent and reject the implements-only narrative as llm_malformed_response.",
        "observed": "The implements-only claim is persisted with answered status."
      },
      "recommendation": "Recognize all supported explicit relations before retrieval and bind both planner and narrative selections to that resolved intent; add independent English and Vietnamese wrong-relation tests.",
      "fingerprint": "sha256:d6e10ea621c23d57b6dbf597cbee41a4829bddce744ba3a1d68946685298677c",
      "round_2_verification": {
        "result": "pass",
        "original_probe": "explicit inherit-from question rejects implements-only output with llm_malformed_response",
        "additional_checks": "All 13 supported relation types dispatch; qualified/backtick/path identifiers do not widen explicit requested relation."
      }
    },
    {
      "id": "FND-TASK-RKG-032-002",
      "severity": "medium",
      "status": "open",
      "title": "Qualified-name collisions produce an apparent self relation",
      "location": {
        "path": "src/rkg/conversations/narrative.py",
        "line": 207,
        "symbol": "render_narrative.label"
      },
      "normative_references": [
        "API-RKG-CORE-v1@16: Backend deterministic renderer",
        "CON-RKG-CONVERSATION-v1@1: Rendering, persistence and failures"
      ],
      "rule": "rendered names must be collision-safe",
      "description": "The renderer counts short names, then blindly falls back to qualified_name without checking that fallback for uniqueness. Distinct valid Callable entities can share both name and qualified_name in different relative files because graph identity includes file path. A call between them renders with identical source and target labels in both English and Vietnamese, implying a self-call and losing the entity distinction. Endpoint method/path labels similarly bypass uniqueness checks.",
      "reproduction": {
        "cases": [
          "distinct_entities_same_qualified_name_en",
          "distinct_entities_same_qualified_name_vi"
        ],
        "environment": "Temporary Kuzu; two published Callable IDs from different relative files with equal name and qualified_name, connected by a calls edge",
        "expected": "Distinct safe labels for both entities in primary answer and persisted claim.",
        "observed": "The persisted source and target labels are identical although their IDs and files differ."
      },
      "recommendation": "Build labels across the actual rendered identity set and extend colliding qualified or endpoint labels with safe relative provenance/type information until distinct; verify both vi/en.",
      "fingerprint": "sha256:77f34a4549a4f483d7115b91014195d1f9fce23ea132ad2da05fa20128b4af56",
      "round_2_verification": {
        "result": "fail",
        "original_probe": "Different relative files sharing a qualified name are now disambiguated in vi/en.",
        "residual_case": "repository_pseudo_identity_collides_with_dependency_label",
        "environment": "Temporary Kuzu graph with repository depends_on an ExternalDependency named repository, valid same-snapshot evidence, explicit dependency root, incoming depends_on narrative via direct runtime MockProvider.",
        "expected": "Repository pseudo identity and dependency label remain distinguishable in persisted answer and claims.",
        "observed": "Both distinct IDs use the same English identity label; the answer and claim imply a self dependency.",
        "cause": "rendered_nodes includes repository ID, but name/base/location collision counters omit IDs absent from nodes; identity() returns a fixed repository label outside this collision algorithm.",
        "location": {
          "path": "src/rkg/conversations/narrative.py",
          "line": 240,
          "symbol": "render_narrative.identity"
        },
        "recommendation": "Include the repository pseudo identity in the same collision namespace as graph entities, and verify distinct labels before emitting claims/answer."
      }
    },
    {
      "id": "FND-TASK-RKG-032-003",
      "severity": "medium",
      "status": "resolved",
      "title": "Indirect access answers omit the factual relation from the primary answer",
      "location": {
        "path": "src/rkg/conversations/narrative.py",
        "line": 271,
        "symbol": "render_narrative"
      },
      "normative_references": [
