  record: |-
    # CTX-TASK-RKG-001

    ## objective
    TASK-RKG-001 — Project skeleton and toolchain (T-01 / M0 nền tảng).

    ## requirements
    - Không gắn AC nghiệp vụ riêng; là task nền tảng (epic trực tiếp, không qua Story).
    - Phục vụ DoD giai đoạn I: clean env chạy được lệnh frontend; lock dependency; check tối thiểu.
    - Analyzer target: CPython 3.12 (SPEC); patch + lock chốt tại T-01 (ARCHITECTURE §2, D-06).
    - UI stack: React + Vite (PRD, CMP-RKG-WEB, ARCHITECTURE).

    ## design
    - CMP-RKG-WEB — cây `frontend/` (React/Vite); tách mock/live để lại cho T-17.
    - CMP-RKG-TRANSPORT — production sẽ phục vụ Vite build cùng origin; T-01 chỉ chuẩn bị layout + toolchain, chưa wire serve.
    - ADR-2026-001 — CPython 3.12 static analysis; không thêm Neo4j/Celery/Redis/vector DB.

    ## layout_target
    ```text
    src/rkg/          # package Python tối thiểu (placeholder modules theo ARCHITECTURE §3)
    tests/            # unit/ + smoke tối thiểu; fixtures/ để trống hoặc .gitkeep
    frontend/         # Vite + React app tối thiểu
    pyproject.toml    # metadata + tool config + Python requires
    uv.lock           # lock Python (đề xuất)
    frontend/package.json + lockfile
    README.md         # lệnh install / check / build thật
    ```

    ## constraints
    - Không implement analyzer, API, Kùzu, LLM, Explorer flows (T-02… / T-17).
    - Không giả claim feature đã chạy; không tự approve gate / baseline.
    - Không commit secret; config mẫu không chứa credential.
    - Domain không import API/UI/provider (boundary giữ từ skeleton).
    - Artifact `.aide/` phần lớn vẫn `draft`; `docs/SPEC.md` + `docs/ARCHITECTURE.md` là nguồn đối chiếu toolchain cho task này.

    ## decisions_to_lock_in_plan
    - Python package manager + lockfile format.
    - CPython 3.12 patch pin (ghi trong pyproject / README).
    - Node major + frontend package manager + lockfile.
    - Lệnh tối thiểu: install, lint/typecheck hoặc smoke, test (pytest), frontend build/dev.
    - Thư viện graph cụ thể: chưa chọn ở T-01 nếu chưa cần runtime — ghi “chốt khi T-17” nếu chưa đưa vào package.json.

    ## previous_findings
    []

