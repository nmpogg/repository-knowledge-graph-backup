  record: |-
    # CTX-TASK-RKG-021

    ## objective
    Lộ conversation qua API và UI trên snapshot thật, không đổi service grounded.

    ## requirements
    - AC-RKG-041
    - AC-RKG-046
    - AC-RKG-047
    - AC-RKG-059

    ## design
    - CMP-RKG-TRANSPORT — gồm transaction boundary, idempotency và concurrency của component này
    - CMP-RKG-WEB — gồm transaction boundary, idempotency và concurrency của component này
