  record: |-
    # CTX-TASK-RKG-018

    ## objective
    Lưu conversation trên cùng DB, pin snapshot, idempotency theo client_request_id.

    ## requirements
    - AC-RKG-030
    - AC-RKG-031
    - AC-RKG-032
    - AC-RKG-033
    - AC-RKG-044
    - AC-RKG-045

    ## design
    - CMP-RKG-CONVERSATION — gồm transaction boundary, idempotency và concurrency của component này
    - CMP-RKG-GRAPH — gồm transaction boundary, idempotency và concurrency của component này
    - Transaction boundary: Commit pending rồi nhả transaction trước provider. Finalize là transaction khác với revision guard. Xóa tôn trọng reference.
    - Rollback: Turn pending recovery thành failed/interrupted, không đổi focus đã commit. Không migration phá snapshot cũ.

    ## decisions
    - ADR-2026-003

    ## contracts
    - TBL-RKG-GRAPH
    - API-RKG-CORE-v1
    - Contract Gate chưa đóng. Task pin contract hiện hành, không coi là bản đã release breaking.

    ## constraints
    - NFR-RKG-REL-001
    - NFR-RKG-SEC-001

    ## code_scope
    - src/rkg/conversations/**
    - src/rkg/storage/conversations.py
    - src/rkg/storage/turns.py

    ## applicable_rules
    - GATE-RKG-SCOPE, GATE-RKG-ARCHITECTURE đã khóa trong BL-r1 cho phần requirements và architecture lúc baseline.
    - GATE-RKG-CONTRACT còn pending. UI/UX chỉ là input khi task đụng màn hình.

    ## previous_findings
    []

    ## verification_intent
    Mỗi AC liệt kê ở trên có một kiểm chứng quan sát được trong plan của chính task. Không mượn AC của lát cắt sau.
