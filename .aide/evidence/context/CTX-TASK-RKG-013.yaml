  record: |-
    # CTX-TASK-RKG-013

    ## objective
    Publication và active pointer nguyên tử theo repository. Rollback khi lỗi. Không giữ transaction trong lúc parse.

    ## requirements
    - AC-RKG-008

    ## design
    - CMP-RKG-GRAPH — gồm transaction boundary, idempotency và concurrency của component này
    - Transaction boundary: CMP-RKG-GRAPH: transaction ngắn ghi graph đã validate và đổi pointer; parse nằm ngoài.
    - Rollback: Publication lỗi thì rollback toàn bộ. Không có snapshot dở. Schema đổi sau này phải non-destructive với snapshot đã publish.

    ## decisions
    - ADR-2026-002

    ## contracts
    - TBL-RKG-GRAPH
    - Contract Gate chưa đóng. Task pin contract hiện hành, không coi là bản đã release breaking.

    ## constraints
    - NFR-RKG-REL-001
    - NFR-RKG-SEC-001

    ## code_scope
    - src/rkg/storage/**
    - src/rkg/graph/publish.py

    ## applicable_rules
    - GATE-RKG-SCOPE, GATE-RKG-ARCHITECTURE đã khóa trong BL-r1 cho phần requirements và architecture lúc baseline.
    - GATE-RKG-CONTRACT còn pending. UI/UX chỉ là input khi task đụng màn hình.

    ## previous_findings
    []

    ## verification_intent
    Mỗi AC liệt kê ở trên có một kiểm chứng quan sát được trong plan của chính task. Không mượn AC của lát cắt sau.
